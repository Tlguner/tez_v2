    Tier 3 · Python Backend Execution &amp; Self-Healing Engine
  </text>

  <!-- Sub-box: Telemetry -->
  <rect x="24" y="288" width="390" height="72" rx="4"
        fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="34" y="306" style="font-size:10px;font-weight:600;fill:#0f172a;">Hardware Telemetry</text>
  <rect x="236" y="293" width="164" height="13" rx="2" fill="#f1f5f9"/>
  <text x="240" y="303"
        style="font-size:8px;font-family:'JetBrains Mono',monospace;fill:#475569;">resource_monitor.py</text>
  <text x="34" y="322" style="font-size:8px;fill:#64748b;">Async sampling: Peak RAM (MB) · CPU% ·</text>
  <text x="34" y="334" style="font-size:8px;fill:#64748b;">Wall-Clock Time (s) · CUDA VRAM (RTX 5070).</text>
  <text x="34" y="350" style="font-size:7.5px;fill:#94a3b8;">→ Serialized in auto_ML_results.json</text>

  <!-- Sub-box: Self-Healing (dashed, slight orange tint) -->
  <rect x="430" y="288" width="426" height="72" rx="4"
        fill="#ffffff" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="440" y="306"
        style="font-size:10px;font-weight:600;fill:#eb6c36;">3-Tiered Self-Healing Loop</text>
  <rect x="718" y="293" width="124" height="13" rx="2" fill="#fff0e8"/>
  <text x="722" y="303"
        style="font-size:8px;font-family:'JetBrains Mono',monospace;fill:#eb6c36;">healing_log.jsonl</text>
  <text x="440" y="322" style="font-size:8px;fill:#64748b;"><tspan font-weight="700" fill="#0f172a">L1</tspan> Unified patch (.diff)  <tspan font-weight="700" fill="#0f172a">L2</tspan> Full script refactor</text>
  <text x="440" y="334" style="font-size:8px;fill:#64748b;"><tspan font-weight="700" fill="#0f172a">L3</tspan> Safe fallback + immutable audit log.</text>
  <text x="440" y="350" style="font-size:7.5px;fill:#94a3b8;">→ 100% autonomous crash recovery</text>

  <!-- ── Connector 3 ─────────────────────────────────────────── -->
  <line x1="440" y1="370" x2="440" y2="388"
        stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="294" y="375" width="292" height="14" rx="7"
        fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="385" text-anchor="middle"
        style="font-size:8px;font-family:'JetBrains Mono',monospace;fill:#64748b;">
    Automated Post-Training Suite Dispatch
  </text>

  <!-- ═══════════════════════════════════════════════════════════════
       TIER 4 — POST-TRAINING VALIDATION SUITE   y=390 h=100
  ══════════════════════════════════════════════════════════════════ -->
  <rect x="12" y="390" width="856" height="104" rx="6"
        fill="#fafafa" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="24" y="383" width="358" height="15" fill="#ffffff"/>
  <text x="28" y="394"
        style="font-size:8.5px;font-family:'JetBrains Mono',monospace;font-weight:700;
               fill:#64748b;letter-spacing:0.07em;text-transform:uppercase;">
    Tier 4 · Post-Training Validation Suite (post_training_pipeline.py)
  </text>

  <!-- 4 modules -->
  <!-- col width: (856-24-20)/4 = 203, gap ~6 -->

  <rect x="28" y="404" width="196" height="80" rx="4"
        fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="38" y="420" style="font-size:9.5px;font-weight:600;fill:#0f172a;">Cross-Dataset Eval</text>
  <rect x="38" y="425" width="120" height="12" rx="2" fill="#f1f5f9"/>
  <text x="42" y="434"
        style="font-size:8px;font-family:'JetBrains Mono',monospace;fill:#475569;">D1 ↔ D2 domain shift</text>
  <text x="38" y="450" style="font-size:8px;fill:#64748b;">Bidirectional transfer</text>
  <text x="38" y="462" style="font-size:8px;fill:#64748b;">without fine-tuning.</text>

  <rect x="232" y="404" width="196" height="80" rx="4"
        fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="242" y="420" style="font-size:9.5px;font-weight:600;fill:#0f172a;">McNemar Paired Test</text>
  <rect x="242" y="425" width="116" height="12" rx="2" fill="#f1f5f9"/>
  <text x="246" y="434"
        style="font-size:8px;font-family:'JetBrains Mono',monospace;fill:#475569;">p-value significance</text>
  <text x="242" y="450" style="font-size:8px;fill:#64748b;">Continuity-corrected χ²</text>
  <text x="242" y="462" style="font-size:8px;fill:#64748b;">test on held-out sets.</text>

  <rect x="436" y="404" width="196" height="80" rx="4"
        fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="446" y="420" style="font-size:9.5px;font-weight:600;fill:#0f172a;">5-Seed Stability</text>
  <rect x="446" y="425" width="108" height="12" rx="2" fill="#f1f5f9"/>
  <text x="450" y="434"
        style="font-size:8px;font-family:'JetBrains Mono',monospace;fill:#475569;">mean ± std dev (σ)</text>
  <text x="446" y="450" style="font-size:8px;fill:#64748b;">5 random seeds;</text>
  <text x="446" y="462" style="font-size:8px;fill:#64748b;">TextCNN σ ≤ 0.09%.</text>

  <rect x="640" y="404" width="216" height="80" rx="4"
        fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="650" y="420" style="font-size:9.5px;font-weight:600;fill:#0f172a;">DistilBERT Baseline</text>
  <rect x="650" y="425" width="108" height="12" rx="2" fill="#f1f5f9"/>
  <text x="654" y="434"
        style="font-size:8px;font-family:'JetBrains Mono',monospace;fill:#475569;">66M transformer</text>
  <text x="650" y="450" style="font-size:8px;fill:#64748b;">18.1× faster, 33.7× lighter,</text>
  <text x="650" y="462" style="font-size:8px;fill:#64748b;">recall: 98.97% (TextCNN).</text>

  <!-- Storage footer -->
  <line x1="28" y1="488" x2="856" y2="488"
        stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="440" y="500" text-anchor="middle"
        style="font-size:8px;fill:#94a3b8;font-family:'JetBrains Mono',monospace;">
    Artifacts: thesis_pipeline/ML/runs/  ·  thesis_pipeline/DL/runs/  (Metrics JSON · Model Checkpoints · Plots)
  </text>

</svg>
