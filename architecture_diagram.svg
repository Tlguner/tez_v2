  </text>

  <!-- ═══════════════════════════════════════════════════════════════
       TIER 3 — PYTHON EXECUTION & SELF-HEALING   y=274 h=96
  ══════════════════════════════════════════════════════════════════ -->
  <rect x="12" y="274" width="856" height="96" rx="6"
        fill="#fafafa" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="24" y="267" width="340" height="15" fill="#ffffff"/>
